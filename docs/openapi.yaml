        '200':
          description: Successful response
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API Key provided by Pigeon Express
    ApiSecretAuth:
      type: apiKey
      in: header
      name: X-API-Secret
      description: API Secret provided by Pigeon Express

  schemas:
    City:
      type: object
      properties:
        id:
          type: integer
          example: 68134
        name:
          type: string
          example: "София"
        name_en:
          type: string
          example: "Sofia"
        region:
          type: string
          example: "София"
        municipality:
          type: string
          example: "Столична"
        post_code:
          type: string
          example: "1000"
        type:
          type: string
          description: City type in Bulgarian
          enum:
            - град
            - село
            - к.к.
            - курорт
          example: "град"
        country_code:
          type: string
          example: "BGR"
      required:
        - id
        - name
        - type

    Street:
      type: object
      properties:
        id:
          type: integer
          example: 12345
        city_id:
          type: integer
          example: 68134
        name:
          type: string
          example: "Витоша"
        name_en:
          type: string
          nullable: true
          example: "Vitosha"
        type:
          type: string
          description: Street type in Bulgarian
          enum:
            - улица
            - булевард
            - площад
            - алея
            - махала
            - местност
            - квартал
          example: "булевард"
      required:
        - id
        - city_id
        - name
        - type

    Office:
      type: object
      properties:
        id:
          type: integer
          example: 1001
        name:
          type: string
          example: "София - Център"
        city_id:
          type: integer
          example: 68134
        address:
          type: string
          example: "бул. Витоша 100"
        type:
          type: string
          enum:
            - office
            - locker
          example: "office"
        latitude:
          type: number
          format: float
          nullable: true
          example: 42.6977
        longitude:
          type: number
          format: float
          nullable: true
          example: 23.3219
        working_hours:
          type: array
          items:
            $ref: '#/components/schemas/WorkingHours'
        max_weight:
          type: number
          format: float
          nullable: true
          description: Maximum package weight in kg (for lockers)
          example: 20
        max_dimensions:
          type: object
          nullable: true
          description: Maximum dimensions (for lockers)
          properties:
            length:
              type: integer
              example: 60
            width:
              type: integer
              example: 40
            height:
              type: integer
              example: 40
      required:
        - id
        - name
        - city_id
        - address
        - type

    WorkingHours:
      type: object
      properties:
        day:
          type: string
          enum:
            - monday
            - tuesday
            - wednesday
            - thursday
            - friday
            - saturday
            - sunday
          example: "monday"
        open:
          type: string
          example: "09:00"
        close:
          type: string
          example: "18:00"
        is_closed:
          type: boolean
          example: false

    Package:
      type: object
      properties:
        weight:
          type: number
          format: float
          description: Weight in kg
          minimum: 0.1
          maximum: 30
          example: 1.5
        length:
          type: integer
          description: Length in cm
          minimum: 1
          maximum: 200
          example: 30
        width:
          type: integer
          description: Width in cm
          minimum: 1
          maximum: 200
          example: 20
        height:
          type: integer
          description: Height in cm
          minimum: 1
          maximum: 200
          example: 15
      required:
        - weight

    Address:
      type: object
      properties:
        city_id:
          type: integer
          description: City ID from cities API
          example: 68134
        street_id:
          type: integer
          nullable: true
          description: Street ID from streets API (optional)
          example: 12345
        street_name:
          type: string
          nullable: true
          description: Street name (alternative to street_id)
          example: "Витоша"
        street_number:
          type: string
          example: "100"
        building_number:
          type: string
          nullable: true
          example: "А"
        entrance:
          type: string
          nullable: true
          example: "1"
        floor:
          type: string
          nullable: true
          example: "3"
        apartment:
          type: string
          nullable: true
          example: "12"
        postal_code:
          type: string
          nullable: true
          example: "1000"
        note:
          type: string
          nullable: true
          description: Additional delivery instructions
          example: "Вход от двора"
      required:
        - city_id
        - street_number

    CalculateShipmentRequest:
      type: object
      properties:
        pickup_type:
          type: string
          enum:
            - address
            - office
          example: "office"
        pickup_office_id:
          type: integer
          description: Required if pickup_type is 'office'
          example: 1001
        pickup_address:
          $ref: '#/components/schemas/Address'
          description: Required if pickup_type is 'address'
        delivery_type:
          type: string
          enum:
            - address
            - office
            - locker
          example: "address"
        delivery_office_id:
          type: integer
          description: Required if delivery_type is 'office' or 'locker'
          example: 2001
        delivery_address:
          $ref: '#/components/schemas/Address'
          description: Required if delivery_type is 'address'
        packages:
          type: array
          items:
            $ref: '#/components/schemas/Package'
          minItems: 1
        service_type:
          type: string
          enum:
            - standard
            - express
          default: standard
        who_pays:
          type: string
          enum:
            - sender
            - receiver
          default: sender
        cod_amount:
          type: number
          format: float
          description: Cash on delivery amount (0 for prepaid)
          minimum: 0
          example: 50.00
      required:
        - pickup_type
        - delivery_type
        - packages

    ShipmentCalculation:
      type: object
      properties:
        shipping_price:
          type: number
          format: float
          description: Base shipping cost
          example: 5.99
        total_price:
          type: number
          format: float
          description: Total cost including all fees
          example: 7.49
        currency:
          type: string
          example: "BGN"
        estimated_delivery_days:
          type: integer
          description: Estimated delivery time in business days
          example: 2
        service_fees:
          type: array
          items:
            $ref: '#/components/schemas/ServiceFee'

    ServiceFee:
      type: object
      properties:
        name:
          type: string
          example: "Наложен платеж"
        amount:
          type: number
          format: float
          example: 1.50

    CreateShipmentRequest:
      type: object
      properties:
        receiver_name:
          type: string
          description: Full name of recipient
          example: "Иван Петров"
        receiver_phone:
          type: string
          description: Phone number (Bulgarian format)
          example: "+359888123456"
        receiver_email:
          type: string
          format: email
          nullable: true
          example: "ivan@example.com"
        pickup_type:
          type: string
          enum:
            - address
            - office
          example: "office"
        pickup_office_id:
          type: integer
          description: Required if pickup_type is 'office'
          example: 1001
        pickup_address:
          $ref: '#/components/schemas/Address'
          description: Required if pickup_type is 'address'
        delivery_type:
          type: string
          enum:
            - address
            - office
            - locker
          example: "address"
        delivery_office_id:
          type: integer
          description: Required if delivery_type is 'office' or 'locker'
          example: 2001
        delivery_address:
          $ref: '#/components/schemas/Address'
          description: Required if delivery_type is 'address'
        packages:
          type: array
          items:
            $ref: '#/components/schemas/Package'
          minItems: 1
        service_type:
          type: string
          enum:
            - standard
            - express
          default: standard
        who_pays:
          type: string
          enum:
            - sender
            - receiver
          default: sender
        cod_amount:
          type: number
          format: float
          description: Cash on delivery amount (product value only, without delivery fee)
          minimum: 0
          example: 50.00
        sms_notification:
          type: boolean
          description: Send SMS updates to recipient
          default: false
        note:
          type: string
          nullable: true
          description: Note for courier
          example: "Да се обади преди доставка"
      required:
        - receiver_name
        - receiver_phone
        - pickup_type
        - delivery_type
        - packages

    Shipment:
      type: object
      properties:
        reference_number:
          type: string
          description: Internal reference number
          example: "455123456789"
        tracking_number:
          type: string
          description: Public tracking number
          example: "455123456789"
        status:
          type: string
          enum:
            - created
            - picked_up
            - in_transit
            - out_for_delivery
            - delivered
            - returned
            - cancelled
          example: "created"
        shipping_price:
          type: number
          format: float
          example: 5.99
        total_price:
          type: number
          format: float
          example: 7.49
        currency:
          type: string
          example: "BGN"
        estimated_delivery:
          type: string
          format: date
          example: "2026-02-20"
        created_at:
          type: string
          format: date-time
          example: "2026-02-18T10:30:00Z"

    TrackingResponse:
      type: object
      properties:
        reference_number:
          type: string
          example: "455123456789"
        tracking_number:
          type: string
          example: "455651653781"
        current_status:
          type: string
          example: "in_transit"
        events:
          type: array
          items:
            $ref: '#/components/schemas/TrackingEvent'

    TrackingEvent:
      type: object
      properties:
        status:
          type: string
          example: "picked_up"
        description:
          type: string
          example: "Пратката е взета от куриер"
        location:
          type: string
          nullable: true
          example: "София - Център"
        timestamp:
          type: string
          format: date-time
          example: "2026-02-18T14:30:00Z"

    Pagination:
      type: object
      properties:
        current_page:
          type: integer
          example: 1
        per_page:
          type: integer
          example: 50
        total:
          type: integer
          example: 150
        total_pages:
          type: integer
          example: 3

    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: "INVALID_CITY_ID"
            message:
              type: string
              description: Error message in Bulgarian
              example: "Невалиден град"

  responses:
    BadRequest:
      description: Bad request - Invalid parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error:
              code: "MISSING_REQUIRED_FIELD"
              message: "Липсващо задължително поле"

    Unauthorized:
      description: Unauthorized - Invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error:
              code: "INVALID_API_KEY"
              message: "Невалиден API ключ"

    NotFound:
      description: Not found - Resource doesn't exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error:
              code: "NOT_FOUND"
              message: "Ресурсът не е намерен"

    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error:
              code: "INVALID_PHONE"
              message: "Невалиден телефонен номер"

    RateLimited:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error:
              code: "RATE_LIMIT_EXCEEDED"
              message: "Надвишен лимит на заявки"
      headers:
        Retry-After:
          description: Seconds to wait before retrying
          schema:
            type: integer
            example: 60

    ServerError:
      description: Server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error:
              code: "SERVICE_UNAVAILABLE"
              message: "Външната система е временно недостъпна"

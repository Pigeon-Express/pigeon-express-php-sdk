  /shipments/{referenceNumber}/label:
    get:
      tags:
        - Shipments
      summary: Get shipping label
      description: Download shipping label as PDF
      operationId: getShipmentLabel
      parameters:
        - name: referenceNumber
          in: path
          description: Shipment reference number
          required: true
          schema:
            type: string
        - name: format
          in: query
          description: Label format
          schema:
            type: string
            enum:
              - pdf
              - zpl
            default: pdf
      x-codeSamples:
        - lang: Shell
          label: cURL
          source: |
            # Download PDF label
            curl -X GET "https://api-demo.pigeonexpress.com/v1/shipments/455123456789/label?format=pdf" \
              -H "X-API-Key: your-api-key" \
              -H "X-API-Secret: your-api-secret" \
              --output label.pdf

            # Download ZPL label (for thermal printers)
            curl -X GET "https://api-demo.pigeonexpress.com/v1/shipments/455123456789/label?format=zpl" \
              -H "X-API-Key: your-api-key" \
              -H "X-API-Secret: your-api-secret" \
              --output label.zpl
        - lang: PHP
          label: PHP (cURL)
          source: |
            <?php
            $referenceNumber = '455123456789';
            $format = 'pdf'; // or 'zpl'

            $curl = curl_init();
            curl_setopt_array($curl, [
                CURLOPT_URL => "https://api-demo.pigeonexpress.com/v1/shipments/{$referenceNumber}/label?format={$format}",
                CURLOPT_RETURNTRANSFER => true,
                CURLOPT_HTTPHEADER => [
                    "X-API-Key: your-api-key",
                    "X-API-Secret: your-api-secret"
                ],
            ]);
            $labelContent = curl_exec($curl);
            $contentType = curl_getinfo($curl, CURLINFO_CONTENT_TYPE);
            curl_close($curl);

            // Save to file
            file_put_contents("label.{$format}", $labelContent);

            // Or output to browser
            header("Content-Type: {$contentType}");
            header("Content-Disposition: attachment; filename=\"label.{$format}\"");
            echo $labelContent;
        - lang: PHP
          label: PHP SDK
          source: |
            <?php
            use PigeonExpress\PigeonExpress;

            $client = new PigeonExpress($apiKey, $apiSecret);

            // Get PDF label
            $pdfContent = $client->shipments()->getLabel('455123456789', 'pdf');
            file_put_contents('label.pdf', $pdfContent);

            // Get ZPL label for thermal printer
            $zplContent = $client->shipments()->getLabel('455123456789', 'zpl');
            file_put_contents('label.zpl', $zplContent);

            // Stream to browser
            header('Content-Type: application/pdf');
            header('Content-Disposition: attachment; filename="shipping-label.pdf"');
            echo $client->shipments()->getLabel('455123456789', 'pdf');
        - lang: Java
          label: Java
          source: |
            String referenceNumber = "455123456789";
            String format = "pdf"; // or "zpl"

            HttpClient client = HttpClient.newHttpClient();
            HttpRequest request = HttpRequest.newBuilder()
                .uri(URI.create("https://api-demo.pigeonexpress.com/v1/shipments/" + referenceNumber + "/label?format=" + format))
                .header("X-API-Key", "your-api-key")
                .header("X-API-Secret", "your-api-secret")
                .GET()
                .build();

            // Save to file
            HttpResponse<Path> response = client.send(request,
                HttpResponse.BodyHandlers.ofFile(Path.of("label." + format)));

            System.out.println("Label saved to: " + response.body());

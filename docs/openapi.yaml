openapi: 3.0.3
info:
  title: Pigeon Express API
  description: |
    API for Bulgarian courier service Pigeon Express.

    This API allows you to:
    - Search and retrieve cities, streets, and offices
    - Calculate shipping costs
    - Create shipments and get tracking information

    ## Authentication
    All requests require API Key and API Secret in headers.

    ## Base URLs
    - **Production**: `coming soon`
    - **Sandbox**: `https://api-demo.pigeonexpress.com/v1`
  version: 1.0.0
  # contact:
  #   name: Pigeon Express Support
  #   email: support@pigeonexpress.bg
  #   url: https://pigeonexpress.com/
  license:
    name: Proprietary
    url: https://pigeonexpress.com/privacy

servers:
  - url: coming soon
    description: Production server
  - url: https://api-demo.pigeonexpress.com/v1
    description: Sandbox server

tags:
  - name: Cities
    description: City operations
  - name: Streets
    description: Street operations
  - name: Offices
    description: Office and locker operations
  - name: Shipments
    description: Shipment operations

security:
  - ApiKeyAuth: []
    ApiSecretAuth: []

paths:
  /cities:
    get:
      tags:
        - Cities
      summary: List all cities
      description: Returns paginated list of all serviced cities
      operationId: listCities
      parameters:
        - name: page
          in: query
          description: Page number
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          description: Items per page (max 100)
          schema:
            type: integer
            default: 50
            maximum: 100
      x-codeSamples:
        - lang: Shell
          label: cURL
          source: |
            curl -X GET "https://api-demo.pigeonexpress.com/v1/cities?page=1&per_page=50" \
              -H "X-API-Key: your-api-key" \
              -H "X-API-Secret: your-api-secret"
        - lang: PHP
          label: PHP (cURL)
          source: |
            <?php
            $curl = curl_init();
            curl_setopt_array($curl, [
                CURLOPT_URL => "https://api-demo.pigeonexpress.com/v1/cities?page=1&per_page=50",
                CURLOPT_RETURNTRANSFER => true,
                CURLOPT_HTTPHEADER => [
                    "X-API-Key: your-api-key",
                    "X-API-Secret: your-api-secret"
                ],
            ]);
            $response = curl_exec($curl);
            $cities = json_decode($response, true);
            curl_close($curl);
        - lang: PHP
          label: PHP SDK
          source: |
            <?php
            use PigeonExpress\PigeonExpress;

            $client = new PigeonExpress($apiKey, $apiSecret);
            $cities = $client->cities()->all(['page' => 1, 'per_page' => 50]);

            foreach ($cities as $city) {
                echo $city->getName() . "\n";
            }
        - lang: Java
          label: Java
          source: |
            HttpClient client = HttpClient.newHttpClient();
            HttpRequest request = HttpRequest.newBuilder()
                .uri(URI.create("https://api-demo.pigeonexpress.com/v1/cities?page=1&per_page=50"))
                .header("X-API-Key", "your-api-key")
                .header("X-API-Secret", "your-api-secret")
                .GET()
                .build();
            HttpResponse<String> response = client.send(request,
                HttpResponse.BodyHandlers.ofString());
            System.out.println(response.body());
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/City'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /cities/search:
    get:
      tags:
        - Cities
      summary: Search cities
      description: Search cities by name (supports Bulgarian and English)
      operationId: searchCities
      parameters:
        - name: q
          in: query
          description: Search query (min 2 characters)
          required: true
          schema:
            type: string
            minLength: 2
        - name: limit
          in: query
          description: Maximum results to return
          schema:
            type: integer
            default: 20
            maximum: 50
      x-codeSamples:
        - lang: Shell
          label: cURL
          source: |
            curl -X GET "https://api-demo.pigeonexpress.com/v1/cities/search?q=София&limit=10" \
              -H "X-API-Key: your-api-key" \
              -H "X-API-Secret: your-api-secret"
        - lang: PHP
          label: PHP (cURL)
          source: |
            <?php
            $query = urlencode('София');
            $curl = curl_init();
            curl_setopt_array($curl, [
                CURLOPT_URL => "https://api-demo.pigeonexpress.com/v1/cities/search?q={$query}&limit=10",
                CURLOPT_RETURNTRANSFER => true,
                CURLOPT_HTTPHEADER => [
                    "X-API-Key: your-api-key",
                    "X-API-Secret: your-api-secret"
                ],
            ]);
            $response = curl_exec($curl);
            $cities = json_decode($response, true);
            curl_close($curl);
        - lang: PHP
          label: PHP SDK
          source: |
            <?php
            use PigeonExpress\PigeonExpress;

            $client = new PigeonExpress($apiKey, $apiSecret);
            $cities = $client->cities()->search('София', ['limit' => 10]);

            foreach ($cities as $city) {
                echo $city->getId() . ': ' . $city->getName() . "\n";
            }
        - lang: Java
          label: Java
          source: |
            String query = URLEncoder.encode("София", StandardCharsets.UTF_8);
            HttpClient client = HttpClient.newHttpClient();
            HttpRequest request = HttpRequest.newBuilder()
                .uri(URI.create("https://api-demo.pigeonexpress.com/v1/cities/search?q=" + query + "&limit=10"))
                .header("X-API-Key", "your-api-key")
                .header("X-API-Secret", "your-api-secret")
                .GET()
                .build();
            HttpResponse<String> response = client.send(request,
                HttpResponse.BodyHandlers.ofString());
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/City'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

